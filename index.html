<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>

    <!-- Project fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Instant first paint — inlined critical shell CSS -->
    <style>
      body {
        margin: 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        height: 100vh;
        background: #ffffff;
        color: #171717;
      }

      html.dark body {
        background: #0a0a0a;
        color: #f5f5f5;
      }

      #app {
        height: 100vh;
      }
    </style>

    <!-- Theme bootstrap — prevent FOUC. Mirrors HeroUI's useTheme storage key:
         it sets both the `dark` class and the data-theme attribute on <html>. -->
    <script>
      (function() {
        var theme;
        try { theme = localStorage.getItem('heroui-theme'); } catch (e) {}
        if (theme === 'system' || !theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);
        performance.mark('shell-visible');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
