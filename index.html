<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TTS Workshop</title>

    <!-- Preload Inter font for faster text paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- §5: Instant First Paint — Inlined critical shell CSS (<4KB) -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        height: 100vh;
      }

      /* Light defaults */
      :root {
        --shell-bg: #ffffff;
        --shell-sidebar: #f3f4f6;
        --shell-border: #e5e7eb;
      }
      :root[data-theme="dark"] {
        --shell-bg: #0c0c1d;
        --shell-sidebar: #0f0f26;
        --shell-border: #1e293b;
      }

      body { background: var(--shell-bg); }

      .shell {
        display: grid;
        grid-template-columns: 260px 1fr 320px;
        height: 100vh;
      }
      .shell-sidebar {
        background: var(--shell-sidebar);
        border-right: 1px solid var(--shell-border);
      }
      .shell-main {
        background: var(--shell-bg);
      }
      .shell-history {
        background: var(--shell-sidebar);
        border-left: 1px solid var(--shell-border);
      }
    </style>

    <!-- §5: Theme bootstrap — prevent FOUC -->
    <script>
      (function() {
        var theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        performance.mark('shell-visible');
      })();
    </script>
  </head>
  <body>
    <!-- §5: Static shell skeleton — visible in <50ms -->
    <div id="shell" class="shell">
      <div class="shell-sidebar"></div>
      <div class="shell-main"></div>
      <div class="shell-history"></div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
